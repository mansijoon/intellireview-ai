name: IntelliReview

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run deterministic tests
        run: |
          python -m pytest -q tests

      - name: Repository analysis
        env:
          INTELLIREVIEW_DISABLE_KNOWLEDGE: "1"
        run: |
          intellireview analyze . --json > intellireview-result.json

      - name: Quality gate
        run: |
          python - <<'PY'
          import json

          with open("intellireview-result.json") as f:
              result = json.load(f)

          if result["status"] != "success":
              raise SystemExit(
                  "IntelliReview quality gate failed: "
                  + result["status"]
              )

          if result["successful_count"] != len(result["analyzers"]):
              raise SystemExit(
                  "IntelliReview quality gate failed: "
                  "not all analyzers succeeded"
              )

          print("IntelliReview quality gate: PASS")
          PY
